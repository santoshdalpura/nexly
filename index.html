<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nexly</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#0a0a0b;--card:#151517;--card2:#1d1d20;--line:#2a2a2e;--red:#e11d2e;--red2:#ff3b4e;--text:#f5f5f6;--muted:#9a9aa2;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow-x:hidden}
h1,h2,h3,.brand{font-family:Poppins,sans-serif}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit}
img,video{max-width:100%;display:block}
::-webkit-scrollbar{width:0}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:21px;justify-content:center;margin-bottom:6px}
.brand i{color:var(--red)}
.sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:12px;font-size:14px;outline:none}
.input:focus{border-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600}
.btn-primary{background:linear-gradient(135deg,var(--red),#b3121f);color:#fff;width:100%;margin-top:16px}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.35)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5}
.err{color:#f87171;font-size:12.5px;margin-top:10px;display:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.topbar{position:sticky;top:0;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.topbar .brand{font-size:18px;justify-content:flex-start;margin:0}
.icon-btn{background:transparent;color:var(--text);font-size:18px;padding:8px;position:relative}
.dot{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.page{padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:14px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--card2)}
.avatar-sm{width:32px;height:32px}
.avatar-lg{width:84px;height:84px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-head .t{font-weight:600;font-size:14px}
.post-media{border-radius:12px;margin:10px 0;max-height:420px;object-fit:cover;width:100%}
.post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid var(--line);margin-top:8px;flex-wrap:wrap}
.post-actions button{background:transparent;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:5px}
.post-actions button.liked{color:var(--red2)}
.post-actions button.saved{color:var(--red2)}
.badge{padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
.b-red{background:rgba(225,29,46,.15);color:var(--red2)}
.b-ok{background:rgba(34,197,94,.15);color:var(--ok)}
.b-warn{background:rgba(245,158,11,.15);color:var(--warn)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.story-ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--red),#ff7a85);flex-shrink:0;cursor:pointer}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg)}
.reel{position:relative;height:calc(100vh - 140px);background:#000;border-radius:16px;overflow:hidden;margin-bottom:14px}
.reel video{width:100%;height:100%;object-fit:cover}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;justify-content:space-between;align-items:flex-end}
.reel-side{display:flex;flex-direction:column;gap:16px;align-items:center}
.reel-side button{background:transparent;color:#fff;font-size:20px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
.bottom-nav button{background:transparent;color:var(--muted);font-size:19px;padding:8px 18px}
.bottom-nav button.active{color:var(--red2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.chat-item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.online-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.chat-header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:20}
.msgs{padding:14px;display:flex;flex-direction:column;gap:8px;min-height:calc(100vh - 210px)}
.msg{max-width:75%;padding:9px 13px;border-radius:16px;font-size:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--red),#b3121f);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.msg .meta{font-size:9.5px;opacity:.7;margin-top:3px;text-align:right}
.composer{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:30}
.composer .input{flex:1}
.typing{font-size:11px;color:var(--muted);padding:0 14px 6px}
.call-screen{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column}
.call-video{flex:1;position:relative}
.call-video video{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;bottom:16px;right:16px;width:110px;border-radius:12px;border:2px solid var(--red)}
.call-controls{display:flex;justify-content:center;gap:22px;padding:22px;background:var(--card)}
.call-controls button{width:56px;height:56px;border-radius:50%;font-size:20px;background:var(--card2);color:#fff}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:13px;z-index:400;transition:.3s;opacity:0;max-width:90vw}
#toast.show{transform:translateX(-50%);opacity:1}
#toast.err{border-color:#ef4444;color:#fca5a5}
#toast.ok{border-color:var(--ok);color:#86efac}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty i{font-size:32px;color:var(--line);display:block;margin-bottom:10px}
.skeleton{height:70px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}/* Chat message box ko bottom navigation ke upar rakho */
#chatView .composer {
  bottom: calc(64px + env(safe-area-inset-bottom));
  z-index: 40;
}

#chatView .composer .input {
  min-width: 0;
}

#chatView .composer #sendBtn {
  flex-shrink: 0;
}

/* Last message composer ke peeche na chhupe */
#chatView .msgs {
  padding-bottom: calc(160px + env(safe-area-inset-bottom));
}
</style>
</head>
<body>

<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><i class="fa-solid fa-bolt"></i> Nexly</div>
    <p class="sub">Creators ke liye social media platform</p>
    <div id="loginForm">
      <label>Email</label><input id="loginEmail" class="input" type="email" placeholder="email@example.com">
      <label>Password</label><input id="loginPass" class="input" type="password" placeholder="••••••••">
      <button id="loginBtn" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      <p class="err" id="loginErr"></p>
      <p class="sub" style="margin-top:14px">New here? <a href="#" id="showRegister" style="color:var(--red2)">Create account</a></p>
    </div>
    <div id="registerForm" hidden>
      <label>Display Name</label><input id="regName" class="input" placeholder="Your name">
      <label>Username</label><input id="regUsername" class="input" placeholder="username">
      <label>Email</label><input id="regEmail" class="input" type="email" placeholder="email@example.com">
      <label>Password</label><input id="regPass" class="input" type="password" placeholder="Min 6 characters">
      <button id="registerBtn" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Create Account</button>
      <p class="err" id="regErr"></p>
      <p class="sub" style="margin-top:14px">Already have account? <a href="#" id="showLogin" style="color:var(--red2)">Login</a></p>
    </div>
  </div>
</div>

<div id="appView" hidden>
  <div class="topbar">
    <div class="brand"><i class="fa-solid fa-bolt"></i> Nexly</div>
    <div>
      <button class="icon-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" id="notifBtn"><i class="fa-solid fa-bell"></i><span class="dot" id="notifDot" hidden>0</span></button>
    </div>
  </div>

  <div class="app">
    <div id="page-home" class="page">
      <div class="stories" id="storiesRow"><div class="skeleton" style="width:62px;height:62px;border-radius:50%"></div></div>
      <div id="feed"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>

    <div id="page-reels" class="page" hidden><div id="reelsFeed"><div class="skeleton"></div></div></div>

    <div id="page-create" class="page" hidden>
      <div class="card">
        <h2 style="font-size:16px;margin-bottom:10px"><i class="fa-solid fa-pen" style="color:var(--red)"></i> Create Post</h2>
        <textarea id="postText" class="input" rows="4" placeholder="Kya share karna hai? #hashtag bhi likh sakte ho"></textarea>
        <label>Photo Upload (optional)</label>
        <input id="postImageFile" class="input" type="file" accept="image/*">
        <label>Video Upload (optional — Reel banega)</label>
        <input id="postVideoFile" class="input" type="file" accept="video/*">
        <div id="uploadStatus" class="muted" style="margin-top:8px"></div>
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);margin:12px 0 0">
          <input type="checkbox" id="policyAgree" style="margin-top:3px">
          <span>Main confirm karta hoon ki ye post Nexly ke rules ke against nahi hai — koi adult/nudity content, hate speech, violence, ya illegal material nahi hai.</span>
        </label>
        <button id="createPostBtn" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Publish</button>
      </div>
      <div class="card">
        <h2 style="font-size:16px;margin-bottom:10px"><i class="fa-solid fa-circle-notch" style="color:var(--red)"></i> Add Story</h2>
        <label>Story Photo Upload</label>
        <input id="storyFile" class="input" type="file" accept="image/*">
        <div id="storyUploadStatus" class="muted" style="margin-top:8px"></div>
        <label>Caption</label>
        <input id="storyCaption" class="input" placeholder="Optional caption">
        <button id="addStoryBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Story</button>
      </div>
    </div>

    <div id="page-chats" class="page" hidden>
      <input id="chatSearch" class="input" placeholder="Search users to chat..." style="margin-bottom:12px">
      <div id="chatUsers"><div class="skeleton"></div></div>
    </div>

    <div id="page-profile" class="page" hidden>
      <div class="card" style="text-align:center">
        <img id="myAvatar" class="avatar avatar-lg" style="margin:0 auto 10px" alt="Profile">
        <h2 id="myName" style="font-size:18px"></h2>
        <p class="muted" id="myUsername"></p>
        <p style="font-size:13px;margin:8px 0" id="myBio"></p>
        <div class="row" style="justify-content:center;gap:22px;margin:12px 0">
          <div><b id="myPosts">0</b><div class="muted">Posts</div></div>
          <div><b id="myFollowers">0</b><div class="muted">Followers</div></div>
          <div><b id="myFollowing">0</b><div class="muted">Following</div></div>
        </div>
        <span class="badge b-red" id="myVerified" hidden><i class="fa-solid fa-circle-check"></i> Verified Creator</span>
        <button id="editProfileBtn" class="btn btn-ghost" style="margin-top:14px"><i class="fa-solid fa-pen"></i> Edit Profile</button>
        <button id="savedBtn" class="btn btn-ghost" style="margin-top:8px"><i class="fa-solid fa-bookmark"></i> Saved Posts</button>
        <button id="logoutBtn" class="btn btn-danger" style="margin-top:8px"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
      </div>
      <h3 style="margin:6px 0 10px">My Posts</h3>
      <div id="myPostsList"><div class="skeleton"></div></div>
    </div>

    <div id="page-search" class="page" hidden>
      <input id="searchInput" class="input" placeholder="Search users, posts, #hashtags" style="margin-bottom:12px">
      <div id="searchResults"></div>
    </div>

    <div id="page-notifs" class="page" hidden>
      <div class="card" id="notifList"><div class="skeleton"></div></div>
    </div>

    <div id="chatView" hidden>
      <div class="chat-header">
        <button class="icon-btn" id="chatBack"><i class="fa-solid fa-arrow-left"></i></button>
        <img id="chatAvatar" class="avatar avatar-sm" alt="">
        <div style="flex:1"><div id="chatName" style="font-weight:600;font-size:14px"></div>
        <div class="muted" id="chatStatus" style="font-size:11px"></div></div>
        <button class="icon-btn" id="audioCallBtn"><i class="fa-solid fa-phone"></i></button>
        <button class="icon-btn" id="videoCallBtn"><i class="fa-solid fa-video"></i></button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="typing" id="typingIndicator" hidden>typing...</div>
      <div class="composer">
        <input id="msgInput" class="input" placeholder="Message...">
        <button class="btn btn-primary" id="sendBtn" style="width:auto;margin:0;padding:11px 15px"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button data-page="home" class="active"><i class="fa-solid fa-house"></i></button>
    <button data-page="reels"><i class="fa-solid fa-film"></i></button>
    <button data-page="create"><i class="fa-solid fa-plus"></i></button>
    <button data-page="chats"><i class="fa-solid fa-comment"></i></button>
    <button data-page="profile"><i class="fa-solid fa-user"></i></button>
  </nav>
</div>

<div id="storyViewer" class="modal-bg" hidden>
  <div style="width:100%;max-width:400px;position:relative">
    <img id="storyImg" style="width:100%;border-radius:16px" alt="Story">
    <p id="storyCaption" style="text-align:center;margin-top:10px"></p>
    <button class="btn btn-ghost" id="storyClose" style="position:absolute;top:10px;right:10px"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<div id="commentsModal" class="modal-bg" hidden>
  <div class="modal">
    <h3 style="margin-bottom:12px">Comments</h3>
    <div id="commentsList" style="max-height:300px;overflow:auto"></div>
    <div class="row" style="margin-top:12px">
      <input id="commentInput" class="input" placeholder="Add a comment...">
      <button class="btn btn-primary" id="commentSend" style="width:auto;margin:0;padding:10px 14px"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" id="commentsClose">Close</button></div>
  </div>
</div>

<div id="editModal" class="modal-bg" hidden>
  <div class="modal">
    <h3 style="margin-bottom:12px">Edit Profile</h3>
    <label>Display Name</label><input id="editName" class="input">
    <label>Username</label><input id="editUsername" class="input">
    <label>Bio</label><textarea id="editBio" class="input" rows="3"></textarea>
    <label>Profile Image</label><input id="editImageFile" class="input" type="file" accept="image/*">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="editCancel">Cancel</button>
      <button class="btn btn-primary" id="editSave" style="width:auto">Save</button>
    </div>
  </div>
</div>

<div id="callScreen" class="call-screen" hidden>
  <div class="call-video">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div style="position:absolute;top:20px;left:0;right:0;text-align:center">
      <div id="callName" style="font-family:Poppins;font-size:18px;font-weight:600"></div>
      <div id="callStatus" style="color:var(--muted);font-size:12px;margin-top:4px">Connecting...</div>
    </div>
  </div>
  <div class="call-controls">
    <button id="muteBtn"><i class="fa-solid fa-microphone"></i></button>
    <button id="camBtn"><i class="fa-solid fa-video"></i></button>
    <button id="endCallBtn" style="background:var(--red)"><i class="fa-solid fa-phone-slash"></i></button>
  </div>
</div>

<div id="incomingCall" class="modal-bg" hidden>
  <div class="modal" style="text-align:center">
    <i class="fa-solid fa-phone-volume" style="font-size:36px;color:var(--red2)"></i>
    <h3 id="incomingName" style="margin:12px 0 4px"></h3>
    <p class="muted" id="incomingType">Incoming call</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn btn-danger" id="rejectCall"><i class="fa-solid fa-xmark"></i> Reject</button>
      <button class="btn btn-primary" id="acceptCall" style="width:auto"><i class="fa-solid fa-phone"></i> Accept</button>
    </div>
  </div>
</div>
<div id="followListModal" class="modal-bg" hidden>
  <div class="modal">
    <h3 id="followListTitle" style="margin-bottom:12px">Followers</h3>
    <div id="followListBody" style="max-height:350px;overflow:auto"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="followListClose">Close</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================= FIREBASE (READY) ================= */
const firebaseConfig = {
  apiKey: "AIzaSyD02Wdq0YiONAiXcuht6-CZz5IyOMfEcZY",
  authDomain: "social-media-62650.firebaseapp.com",
  databaseURL: "https://social-media-62650-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "social-media-62650",
  storageBucket: "social-media-62650.firebasestorage.app",
  messagingSenderId: "16936643031",
  appId: "1:16936643031:web:e885e2c3f9771bf5c48392"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ================= CLOUDINARY (READY) ================= */
const CLOUD_NAME = "fad4lltm";
const UPLOAD_PRESET = "Creatorhub";

async function uploadToCloudinary(file, resourceType){
  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);
  const res = await fetch(url, { method: "POST", body: formData });
  if(!res.ok) throw new Error("Upload failed");
  const data = await res.json();
  return data.secure_url;
}

/* ================= STATE / UTILS ================= */
let me = null, myId = null, activeChat = null, activePost = null;
let currentCall = null, localStream = null, pc = null;
const $ = id => document.getElementById(id);
let toastTimer;
function toast(m,t=""){const el=$("toast");el.textContent=m;el.className="show "+t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className="",3000);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function timeAgo(ts){if(!ts)return"";const m=Math.floor((Date.now()-ts)/60000);if(m<1)return"now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return new Date(ts).toLocaleDateString();}
function convId(a,b){return [a,b].sort().join("__");}
function friendlyError(e){const c=e?.code||"";if(c.includes("email-already"))return"Ye email already registered hai.";if(c.includes("invalid-email"))return"Email format galat hai.";if(c.includes("weak-password"))return"Password kam se kam 6 characters ka hona chahiye.";if(c.includes("invalid-credential")||c.includes("wrong-password"))return"Galat email ya password.";if(c.includes("user-not-found"))return"Ye email registered nahi hai.";if(c.includes("network"))return"Network error. Internet check karein.";if(c.includes("permission"))return"Permission denied. Rules check karein.";return e?.message||"Kuch galat ho gaya.";}
function extractHashtags(text){return (text.match(/#[\w]+/g)||[]).map(t=>t.slice(1).toLowerCase());}

/* ================= MODERATION ================= */
const bannedWords=["porn","sex","nude","nudes","naked","xxx","adult","hentai","onlyfans","18+","boobs","dick","pussy","fuck","horny","erotic","sexy video","blue film"];
function checkContent(text,url){
  const lower=(text+" "+url).toLowerCase();
  return bannedWords.find(w=>lower.includes(w))||null;
}

auth.onAuthStateChanged(async user=>{
  if(!user){$("authView").hidden=false;$("appView").hidden=true;return;}
  myId=user.uid;
  const snap=await db.ref("users/"+myId).get();
  me=snap.exists()?snap.val():null;
  if(!me){
    me={uid:myId,username:"user"+myId.slice(0,6),displayName:user.email.split("@")[0],email:user.email,profileImage:"",bio:"",followersCount:0,followingCount:0,postsCount:0,isVerified:false,isCreator:false,isBlocked:false,createdAt:Date.now()};
    await db.ref("users/"+myId).set(me);
    await db.ref("usernames/"+me.username).set(myId);
  }
  if(me.isBlocked){toast("Aapka account block hai.","err");await auth.signOut();return;}
  $("authView").hidden=true;$("appView").hidden=false;
  setupPresence();loadFeed();loadStories();loadMyProfile();listenNotifications();listenIncomingCalls();
});

$("registerBtn").onclick=async()=>{
  const name=$("regName").value.trim(),un=$("regUsername").value.trim().toLowerCase(),em=$("regEmail").value.trim(),pw=$("regPass").value;
  const err=$("regErr");err.style.display="none";
  if(!name||!un||!em||!pw){err.textContent="Sab fields bharein.";err.style.display="block";return;}
  if(!/^[a-zA-Z0-9_]{3,24}$/.test(un)){err.textContent="Username: 3-24 letters/numbers/underscore.";err.style.display="block";return;}
  if(pw.length<6){err.textContent="Password kam se kam 6 characters.";err.style.display="block";return;}
  $("registerBtn").disabled=true;
  try{
    const unSnap=await db.ref("usernames/"+un).get();
    if(unSnap.exists())throw{code:"username-taken"};
    const cred=await auth.createUserWithEmailAndPassword(em,pw);
    const u={uid:cred.user.uid,username:un,displayName:name,email:em,profileImage:"",bio:"",followersCount:0,followingCount:0,postsCount:0,isVerified:false,isCreator:false,isBlocked:false,createdAt:Date.now()};
    await db.ref("users/"+cred.user.uid).set(u);
    await db.ref("usernames/"+un).set(cred.user.uid);
  }catch(e){
    err.textContent=e.code==="username-taken"?"Ye username already taken hai.":friendlyError(e);
    err.style.display="block";
  }
  $("registerBtn").disabled=false;
};
$("loginBtn").onclick=async()=>{

function setupPresence(){
  const ref=db.ref("presence/"+myId);
  const conn=db.ref(".info/connected");
  conn.on("value",s=>{
    if(s.val()){
      ref.onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
      ref.update({online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});
    }
  });
}

/* ================= FEED (sirf approved posts) ================= */
async function loadFeed(){
  $("feed").innerHTML='<div class="skeleton"></div>';
  try{
    const s=await db.ref("posts").limitToLast(50).get();
    const posts=s.exists()?Object.entries(s.val()).filter(([,p])=>!p.status||p.status==="published").sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)):[];
    if(!posts.length){$("feed").innerHTML='<div class="empty"><i class="fa-solid fa-newspaper"></i>No posts yet. Pehla post banao!</div>';return;}
    $("feed").innerHTML="";
    for(const[id,p]of posts){
      const uSnap=await db.ref("users/"+p.authorId).get();
      const u=uSnap.exists()?uSnap.val():{displayName:"Unknown",username:"unknown",profileImage:""};
      const likeSnap=await db.ref("likes/"+id+"/"+myId).get();
      const saveSnap=await db.ref("savedPosts/"+myId+"/"+id).get();
      $("feed").insertAdjacentHTML("beforeend",renderPost(id,p,u,likeSnap.exists(),saveSnap.exists()));
    }
  }catch(e){$("feed").innerHTML=`<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>${esc(friendlyError(e))}</div>`;}
}
function renderPost(id,p,u,liked,saved){
  const verified=u.isVerified?'<i class="fa-solid fa-circle-check" style="color:var(--red2);font-size:11px"></i>':'';
  let media="";
  if(p.mediaType==="image"&&p.mediaUrl)media=`<img class="post-media" src="${esc(p.mediaUrl)}" alt="post" onerror="this.style.display='none'">`;
  if(p.mediaType==="video"&&p.mediaUrl)media=`<video class="post-media" src="${esc(p.mediaUrl)}" controls playsinline></video>`;
  return`<div class="card" data-post="${esc(id)}">
    <div class="post-head">
      <img class="avatar" src="${esc(u.profileImage||'https://ui-avatars.com/api/?background=e11d2e&color=fff&name='+encodeURIComponent(u.displayName||'U'))}" alt="">
      <div style="flex:1"><div class="t">${esc(u.displayName||"User")} ${verified}</div><div class="muted">@${esc(u.username||"")} · ${timeAgo(p.createdAt)}</div></div>
    </div>
    <div style="font-size:14px;line-height:1.6">${esc(p.text||"").replace(/#(\w+)/g,'<span style="color:var(--red2)">#$1</span>')}</div>
    ${media}
    <div class="post-actions">
      <button class="${liked?'liked':''}" onclick="toggleLike('${esc(id)}')"><i class="fa-${liked?'solid':'regular'} fa-heart"></i> <span id="lc-${esc(id)}">${p.likesCount||0}</span></button>
      <button onclick="openComments('${esc(id)}')"><i class="fa-regular fa-comment"></i> <span id="cc-${esc(id)}">${p.commentsCount||0}</span></button>
      <button onclick="sharePost('${esc(id)}')"><i class="fa-solid fa-share"></i></button>
      <button class="${saved?'saved':''}" onclick="toggleSave('${esc(id)}')"><i class="fa-${saved?'solid':'regular'} fa-bookmark"></i></button>
      <button onclick="reportPost('${esc(id)}')"><i class="fa-regular fa-flag"></i></button>
    </div></div>`;
}
window.toggleLike=async id=>{
  const ref=db.ref("likes/"+id+"/"+myId);
  const s=await ref.get();
  if(s.exists()){await ref.remove();await db.ref("posts/"+id+"/likesCount").transaction(n=>Math.max(0,(n||1)-1));}
  else{await ref.set(true);await db.ref("posts/"+id+"/likesCount").transaction(n=>(n||0)+1);
    const p=await db.ref("posts/"+id).get();const aid=p.val()?.authorId;
    if(aid&&aid!==myId)await db.ref("notifications/"+aid+"/"+db.ref().push().key).set({type:"like",senderId:myId,referenceId:id,message:(me.displayName||"Someone")+" liked your post",read:false,createdAt:Date.now()});}
  loadFeed();
};
window.toggleSave=async id=>{
  const ref=db.ref("savedPosts/"+myId+"/"+id);const s=await ref.get();
  if(s.exists()){await ref.remove();toast("Removed from saved.");}else{await ref.set(true);toast("Post saved.","ok");}
  loadFeed();
};
window.sharePost=async id=>{
  const url=location.href.split("#")[0]+"#post="+id;
  if(navigator.share){try{await navigator.share({title:"Nexly",text:"Check this post",url});}catch{}}
  else{try{await navigator.clipboard.writeText(url);toast("Link copied!","ok");}catch{toast("Copy not supported.","err");}}
};
window.reportPost=async id=>{

  try{

$("createPostBtn").onclick=async()=>{
  const text=$("postText").value.trim();
  const imgFile=$("postImageFile").files[0];
  const vidFile=$("postVideoFile").files[0];
  if(!text&&!imgFile&&!vidFile)return toast("Kuch likho ya photo/video choose karo.","err");
  if(!$("policyAgree").checked)return toast("Pehle content policy accept karo.","err");
  $("createPostBtn").disabled=true;
  $("uploadStatus").textContent="Uploading...";
  let img="",vid="";
  try{
    if(imgFile){
      img=await uploadToCloudinary(imgFile,"image");
      $("uploadStatus").textContent="Photo uploaded!";
    }
    if(vidFile){
      vid=await uploadToCloudinary(vidFile,"video");
      $("uploadStatus").textContent="Video uploaded!";
    }
  }catch(e){
    $("createPostBtn").disabled=false;$("uploadStatus").textContent="";
    return toast("Upload failed. Dobara try karo.","err");
  }
  const flagged=checkContent(text,img||vid);
  const postStatus=flagged?"pending_review":"published";
  try{
    const type=vid?"video":(img?"image":"text");
    const ref=db.ref("posts").push();
    await ref.set({postId:ref.key,authorId:myId,authorName:me.displayName,text,mediaType:type,mediaUrl:vid||img||"",hashtags:extractHashtags(text),likesCount:0,commentsCount:0,sharesCount:0,viewsCount:0,isFeatured:false,createdAt:Date.now(),status:postStatus});
    (extractHashtags(text)).forEach(tag=>db.ref("hashtags/"+tag+"/"+ref.key).set(true));
    await db.ref("users/"+myId+"/postsCount").transaction(n=>(n||0)+1);
    if(flagged){
      await db.ref("reports/"+db.ref().push().key).set({
        reporterId:myId,targetId:ref.key,targetType:"post",
        reason:"Auto-flagged: possible adult content",
        description:"Keyword detected: "+flagged,
        status:"pending",createdAt:Date.now()
      });
      toast("Post review ke liye gaya. Admin approve karega.","ok");
    }else{
      toast("Post published!","ok");
    }
    $("postText").value="";$("postImageFile").value="";$("postVideoFile").value="";$("policyAgree").checked=false;
    $("uploadStatus").textContent="";
    document.querySelector('[data-page="home"]').click();
  }catch(e){toast(friendlyError(e),"err");}
  $("createPostBtn").disabled=false;
};

/* ================= REELS ================= */
async function loadReels(){
  $("reelsFeed").innerHTML='<div class="skeleton"></div>';
  const s=await db.ref("posts").limitToLast(30).get();
  const vids=s.exists()?Object.entries(s.val()).filter(([,p])=>p.mediaType==="video"&&(!p.status||p.status==="published")).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)):[];
  if(!vids.length){$("reelsFeed").innerHTML='<div class="empty"><i class="fa-solid fa-film"></i>No reels yet. Video upload karo!</div>';return;}
  $("reelsFeed").innerHTML="";
  for(const[id,p]of vids){
    const u=await db.ref("users/"+p.authorId).get();
    const un=u.exists()?u.val():{displayName:"U",username:"u",profileImage:""};
    const likeSnap=await db.ref("likes/"+id+"/"+myId).get();
    $("reelsFeed").insertAdjacentHTML("beforeend",`<div class="reel">
      <video src="${esc(p.mediaUrl)}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
      <div class="reel-overlay">
        <div><div style="font-weight:600;font-size:14px;cursor:pointer" onclick="openProfile('${esc(un.uid||p.authorId)}')">@${esc(un.username||"")}</div>
        <div style="font-size:12px;margin-top:4px;max-width:220px">${esc(p.text||"")}</div></div>
        <div class="reel-side">
          <button onclick="toggleLike('${esc(id)}')"><i class="fa-${likeSnap.exists()?'solid':'regular'} fa-heart" style="color:${likeSnap.exists()?'var(--red2)':'#fff'}"></i><div style="font-size:11px">${p.likesCount||0}</div></button>
          <button onclick="openComments('${esc(id)}')"><i class="fa-regular fa-comment"></i><div style="font-size:11px">${p.commentsCount||0}</div></button>
          <button onclick="sharePost('${esc(id)}')"><i class="fa-solid fa-share"></i></button>
          <button onclick="reportPost('${esc(id)}')"><i class="fa-regular fa-flag" style="color:#fff"></i></button>
        </div></div></div>`);
  }
  document.querySelectorAll(".reel video").forEach(v=>{
    new IntersectionObserver(es=>es.forEach(e=>{e.isIntersecting?v.play().catch(()=>{}):v.pause();}),{threshold:.6}).observe(v);
  });
}

$("searchInput").oninput=async e=>{

  const box=$("searchResults");
  if(q.length<2){box.innerHTML="";return;}
  box.innerHTML='<div class="skeleton"></div>';
  let html="";
  const us=await db.ref("users").get();
  us.forEach(u=>{const v=u.val()||{};
    if((v.username||"").toLowerCase().includes(q)||(v.displayName||"").toLowerCase().includes(q))
      html+=`<div class="card row" onclick="openProfile('${esc(u.key)}')">
        <img class="avatar" src="${esc(v.profileImage||'https://ui-avatars.com/api/?background=e11d2e&color=fff&name=U')}" alt="">
        <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(v.displayName)}</div><div class="muted">@${esc(v.username)}</div></div>
        <button class="btn btn-sm btn-ghost">View</button></div>`;});
  const ps=await db.ref("posts").limitToLast(100).get();
  ps.forEach(p=>{const v=p.val()||{};
    if((v.text||"").toLowerCase().includes(q)&&(!v.status||v.status==="published"))
      html+=`<div class="card"><div style="font-size:13.5px">${esc((v.text||"").slice(0,120))}</div><div class="muted" style="margin-top:5px">by ${esc(v.authorName||"")} · ${timeAgo(v.createdAt)}</div></div>`;});
  const hs=await db.ref("hashtags").get();
  hs.forEach(h=>{if(h.key.toLowerCase().includes(q.replace("#","")))html+=`<div class="card"><b style="color:var(--red2)">#${esc(h.key)}</b> <span class="muted">hashtag</span></div>`;});
  box.innerHTML=html||'<div class="empty"><i class="fa-solid fa-magnifying-glass"></i>No results found</div>';
};

async function loadMyProfile(){

  $("myAvatar").src=me.profileImage||'https://ui-avatars.com/api/?background=e11d2e&color=fff&name='+encodeURIComponent(me.displayName||'U');
  $("myName").textContent=me.displayName;$("myUsername").textContent="@"+me.username;
  $("myBio").textContent=me.bio||"No bio yet";$("myPosts").textContent=me.postsCount||0;
  $("myFollowers").textContent=me.followersCount||0;$("myFollowing").textContent=me.followingCount||0;
  $("myVerified").hidden=!me.isVerified;
  const ps=await db.ref("posts").orderByChild("authorId").equalTo(myId).get();
  const posts=ps.exists()?Object.entries(ps.val()).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)):[];
  $("myPostsList").innerHTML=posts.length?posts.map(([id,p])=>`<div class="card">
    <div style="font-size:13.5px">${esc((p.text||"(media)").slice(0,100))}</div>
    <div class="muted" style="margin-top:5px">${p.likesCount||0} likes · ${p.commentsCount||0} comments · ${timeAgo(p.createdAt)} ${p.status==="pending_review"?'<span class="badge b-warn">Pending Review</span>':''}</div>
    <button class="btn btn-sm btn-danger" style="margin-top:8px" onclick="delMyPost('${esc(id)}')"><i class="fa-solid fa-trash"></i> Delete</button></div>`).join("")
    :'<div class="empty"><i class="fa-solid fa-newspaper"></i>No posts yet</div>';
}
window.delMyPost=id=>{if(!confirm("Delete this post?"))return;
  db.ref("posts/"+id).remove();db.ref("likes/"+id).remove();db.ref("comments/"+id).remove();
  db.ref("users/"+myId+"/postsCount").transaction(n=>Math.max(0,(n||1)-1)).then(()=>{toast("Post deleted.","ok");loadMyProfile();});};
$("editProfileBtn").onclick=()=>{$("editName").value=me.displayName;$("editUsername").value=me.username;$("editBio").value=me.bio||"";$("editImageFile").value="";$("editModal").hidden=false;};
$("editCancel").onclick=()=>$("editModal").hidden=true;
$("editSave").onclick=async()=>{
  const name=$("editName").value.trim(),un=$("editUsername").value.trim().toLowerCase();
  if(!name||!/^[a-zA-Z0-9_]{3,24}$/.test(un))return toast("Valid name/username daalein.","err");
  $("editSave").disabled=true;
  try{
    let newImg=me.profileImage||"";
    const imgFile=$("editImageFile").files[0];
    if(imgFile){
      $("editSave").textContent="Uploading...";
      newImg=await uploadToCloudinary(imgFile,"image");
    }
    if(un!==me.username){
      const s=await db.ref("usernames/"+un).get();
      if(s.exists()&&s.val()!==myId){$("editSave").disabled=false;$("editSave").textContent="Save";return toast("Username taken hai.","err");}
      await db.ref("usernames/"+me.username).remove();await db.ref("usernames/"+un).set(myId);
    }
    await db.ref("users/"+myId).update({displayName:name,username:un,bio:$("editBio").value.trim(),profileImage:newImg});
    $("editModal").hidden=true;$("editSave").disabled=false;$("editSave").textContent="Save";
    toast("Profile updated!","ok");loadMyProfile();
  }catch(e){$("editSave").disabled=false;$("editSave").textContent="Save";toast("Upload/update failed.","err");}
};
$("savedBtn").onclick=async()=>{
  const s=await db.ref("savedPosts/"+myId).get();
  if(!s.exists())return toast("Koi saved post nahi.");
  const box=$("searchResults");
  document.querySelectorAll(".bottom-nav button").forEach(x=>x.classList.remove("active"));
  ["home","reels","create","chats","profile","notifs"].forEach(x=>$("page-"+x).hidden=true);
  $("page-search").hidden=false;
  box.innerHTML='<h3 style="margin-bottom:10px">Saved Posts</h3>';

  }
};

/* ================= CHATS ================= */
async function loadChatUsers(){
  $("chatUsers").innerHTML='<div class="skeleton"></div>';
  const q=$("chatSearch").value.trim().toLowerCase();
  const s=await db.ref("users").get();
  let html="";
  s.forEach(u=>{
    if(u.key===myId)return;const v=u.val()||{};
    if(q&&!((v.username||"").toLowerCase().includes(q)||(v.displayName||"").toLowerCase().includes(q)))return;
    html+=`<div class="chat-item" onclick="openChat('${esc(u.key)}')">
      <div style="position:relative"><img class="avatar" src="${esc(v.profileImage||'https://ui-avatars.com/api/?background=e11d2e&color=fff&name=U')}" alt="">
      ${v.online?'<span class="online-dot" style="position:absolute;bottom:0;right:0"></span>':''}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(v.displayName)}</div><div class="muted">@${esc(v.username)}</div></div>
      <button class="btn btn-sm btn-ghost">Chat</button></div>`;
  });
  $("chatUsers").innerHTML=html||'<div class="empty"><i class="fa-solid fa-user-slash"></i>No users found</div>';
}
$("chatSearch").oninput=loadChatUsers;
async function openChat(uid){
  activeChat=uid;
  const u=await db.ref("users/"+uid).get();const v=u.val()||{};
  $("chatName").textContent=v.displayName||"User";
  $("chatAvatar").src=v.profileImage||'https://ui-avatars.com/api/?background=e11d2e&color=fff&name=U';
  $("chatStatus").textContent=v.online?"Online":"Offline";
  document.querySelectorAll(".page").forEach(p=>p.hidden=true);
  $("chatView").hidden=false;
  const cid=convId(myId,uid);
  db.ref("messages/"+cid).limitToLast(100).on("value",s=>{
    const msgs=s.exists()?Object.entries(s.val()).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0)):[];
    $("msgs").innerHTML=msgs.length?msgs.map(([id,m])=>`<div class="msg ${m.senderId===myId?'me':'them'}">
      ${esc(m.text)}<div class="meta">${timeAgo(m.createdAt)}${m.senderId===myId?(m.read?' · ✓✓':' · ✓'):''}</div></div>`).join("")
      :'<div class="empty"><i class="fa-regular fa-comment"></i>Conversation start karo!</div>';
    $("msgs").scrollTop=$("msgs").scrollHeight;
    msgs.forEach(([id,m])=>{if(m.senderId!==myId&&!m.read)db.ref("messages/"+cid+"/"+id+"/read").set(true);});
  });
  db.ref("typing/"+cid+"/"+uid).on("value",s=>{$("typingIndicator").hidden=!s.val();});
  db.ref("presence/"+uid).on("value",s=>{const v=s.val()||{};$("chatStatus").textContent=v.online?"Online":"Last seen "+timeAgo(v.lastSeen);});
}
$("chatBack").onclick=()=>{if(activeChat)db.ref("messages/"+convId(myId,activeChat)).off();$("chatView").hidden=true;document.querySelector('[data-page="chats"]').click();};
let typingTimeout;
$("msgInput").oninput=()=>{
  if(!activeChat)return;

  clearTimeout(typingTimeout);

  if(flagged)return toast("Message me adult/spam word hai.","err");
  $("sendBtn").disabled=true;
  try{
    const cid=convId(myId,activeChat);
    await db.ref("messages/"+cid+"/"+db.ref().push().key).set({senderId:myId,receiverId:activeChat,text,type:"text",read:false,createdAt:Date.now()});

/* ================= WEBRTC CALLS ================= */
const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
$("audioCallBtn").onclick=()=>startCall("audio");
$("videoCallBtn").onclick=()=>startCall("video");
async function startCall(type){
  if(!activeChat)return;
  try{
    localStream=await navigator.mediaDevices.getUserMedia(type==="video"?{audio:true,video:true}:{audio:true});
  }catch(e){return toast("Mic/Camera permission nahi mili.","err");}
  const callRef=db.ref("calls").push();
  currentCall={id:callRef.key,peer:activeChat,type,role:"caller"};
  pc=new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0];$("callStatus").textContent="Connected";};
  pc.onicecandidate=e=>{if(e.candidate)callRef.child("candidates/"+myId).push(e.candidate.toJSON());};
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await callRef.set({callerId:myId,receiverId:activeChat,type,status:"ringing",offer:{type:offer.type,sdp:offer.sdp},createdAt:Date.now()});
  $("callName").textContent=(await db.ref("users/"+activeChat).get()).val()?.displayName||"User";
  $("callStatus").textContent="Ringing...";$("callScreen").hidden=false;
  if(type==="video")$("localVideo").srcObject=localStream;
  callRef.child("answer").on("value",async s=>{
    if(s.exists()&&pc&&pc.signalingState!=="stable"){await pc.setRemoteDescription(new RTCSessionDescription(s.val()));$("callStatus").textContent="Connected";}
  });
  callRef.child("candidates/"+activeChat).on("child_added",async s=>{
    if(pc)try{await pc.addIceCandidate(new RTCIceCandidate(s.val()));}catch{}
  });
  callRef.child("status").on("value",s=>{
    if(s.val()==="rejected"||s.val()==="ended")endCall();
  });
  callRef.child("status").onDisconnect().set("ended");
}
function listenIncomingCalls(){
  db.ref("calls").orderByChild("receiverId").equalTo(myId).limitToLast(1).on("child_added",async s=>{
    const c=s.val();
    if(!c||c.status!=="ringing")return;
    currentCall={id:s.key,peer:c.callerId,type:c.type,role:"receiver",ref:s.ref};
    const u=await db.ref("users/"+c.callerId).get();
    $("incomingName").textContent=u.val()?.displayName||"Unknown";
    $("incomingType").textContent=c.type==="video"?"Incoming video call":"Incoming audio call";
    $("incomingCall").hidden=false;
  });
}
$("acceptCall").onclick=async()=>{
  $("incomingCall").hidden=true;
  try{
    localStream=await navigator.mediaDevices.getUserMedia(currentCall.type==="video"?{audio:true,video:true}:{audio:true});
  }catch(e){await currentCall.ref.child("status").set("rejected");return toast("Mic/Camera permission nahi mili.","err");}
  const callRef=currentCall.ref;
  pc=new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0];$("callStatus").textContent="Connected";};
  pc.onicecandidate=e=>{if(e.candidate)callRef.child("candidates/"+myId).push(e.candidate.toJSON());};
  const offerSnap=await callRef.child("offer").get();
  await pc.setRemoteDescription(new RTCSessionDescription(offerSnap.val()));
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  await callRef.child("answer").set({type:answer.type,sdp:answer.sdp});
  await callRef.child("status").set("active");
  $("callName").textContent=$("incomingName").textContent;
  $("callStatus").textContent="Connected";$("callScreen").hidden=false;
  if(currentCall.type==="video")$("localVideo").srcObject=localStream;
  callRef.child("candidates/"+currentCall.peer).on("child_added",async s=>{
    if(pc)try{await pc.addIceCandidate(new RTCIceCandidate(s.val()));}catch{}
  });
};
$("rejectCall").onclick=async()=>{$("incomingCall").hidden=true;if(currentCall?.ref)await currentCall.ref.child("status").set("rejected");};
$("endCallBtn").onclick=async()=>{if(currentCall?.ref)await currentCall.ref.child("status").set("ended");endCall();};
$("muteBtn").onclick=()=>{const t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$("muteBtn").innerHTML=t.enabled?'<i class="fa-solid fa-microphone"></i>':'<i class="fa-solid fa-microphone-slash"></i>';}};
$("camBtn").onclick=()=>{const t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$("camBtn").innerHTML=t.enabled?'<i class="fa-solid fa-video"></i>':'<i class="fa-solid fa-video-slash"></i>';}};
function endCall(){
  if(pc){pc.close();pc=null;}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  $("remoteVideo").srcObject=null;$("localVideo").srcObject=null;
  $("callScreen").hidden=true;$("incomingCall").hidden=true;
  if(currentCall?.ref){currentCall.ref.child("status").off();currentCall.ref.child("answer").off();}
  currentCall=null;
}/* ================= FOLLOW SYSTEM ================= */
window.toggleFollow=async(uid,isFollowing)=>{
  const btn=$("followBtn-"+uid);
  if(btn)btn.disabled=true;
  try{
    if(isFollowing){
      await db.ref("followers/"+uid+"/"+myId).remove();
      await db.ref("following/"+myId+"/"+uid).remove();
      await db.ref("users/"+uid+"/followersCount").transaction(n=>Math.max(0,(n||1)-1));
      await db.ref("users/"+myId+"/followingCount").transaction(n=>Math.max(0,(n||1)-1));
      toast("Unfollowed.","ok");
    }else{
      await db.ref("followers/"+uid+"/"+myId).set(true);
      await db.ref("following/"+myId+"/"+uid).set(true);
      await db.ref("users/"+uid+"/followersCount").transaction(n=>(n||0)+1);
      await db.ref("users/"+myId+"/followingCount").transaction(n=>(n||0)+1);
      await db.ref("notifications/"+uid+"/"+db.ref().push().key).set({
        type:"follow",senderId:myId,referenceId:myId,
        message:(me.displayName||"Someone")+" started following you",
        read:false,createdAt:Date.now()
      });
      toast("Followed!","ok");
    }
    openProfile(uid);
  }catch(e){toast(friendlyError(e),"err");}
  if(btn)btn.disabled=false;
};

  try{

        <div style="font-size:13.5px">${esc((p.text||"(media)").slice(0,120))}</div>
        ${media}
        <div class="muted" style="margin-top:6px">${p.likesCount||0} likes · ${p.commentsCount||0} comments · ${timeAgo(p.createdAt)}</div>
        <button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="openComments('${esc(id)}')"><i class="fa-regular fa-comment"></i> Comments</button></div>`;
    }).join(""):'<div class="empty"><i class="fa-solid fa-newspaper"></i>No posts yet</div>';
  }catch(e){box.innerHTML=`<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>${esc(friendlyError(e))}</div>`;}
};
</script>
</body>
</html>
